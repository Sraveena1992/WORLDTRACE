name: WORLDTRACE Final Acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout WORLDTRACE
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Compile all Python code
        run: python -m compileall -q app.py worldtrace scripts
      - name: Verify frontend JavaScript syntax
        run: node --check static/app.js
      - name: Run complete regression suite
        run: python -m pytest -q
      - name: Prove approval-gated correction and re-verification
        run: python scripts/demo_resolution.py
      - name: Run independent judge safety benchmark
        run: python scripts/judge_benchmark.py
